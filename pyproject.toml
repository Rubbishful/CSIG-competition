[project]
name = "hypir"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "accelerate==1.4.0",
    "diffusers==0.32.2",
    "einops==0.8.1",
    "gradio==5.21.0",
    "lpips==0.1.4",
    "omegaconf==2.3.0",
    "open-clip-torch==2.31.0",
    "openai==1.96.1",
    "opencv-python-headless==4.11.0.86",
    "peft==0.14.0",
    "polars==1.24.0",
    "pydantic==2.10.6",
    "python-dotenv==1.1.1",
    "tenacity==9.1.2",
    "tensorboard==2.19.0",
    "timm==1.0.15",
    "torch==2.6.0",
    "torchvision==0.21.0",
    "transformers==4.49.0",
    "vision-aided-loss==0.1.0",
]

[tool.uv]
environments = ["sys_platform == 'win32'"]   # 限制只解析 Windows

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
